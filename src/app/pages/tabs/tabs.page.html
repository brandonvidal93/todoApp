<ion-tabs>
  <ion-tab-bar>
    <ion-tab-button
      tab="tasks"
      [routerLink]="['/tabs/tasks']">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Tareas</ion-label>
    </ion-tab-button>

    <ion-tab-button
      *ngIf="enabled$ | async"
      tab="categories"
      [routerLink]="['/tabs/categories']">
      <ion-icon name="folder-outline"></ion-icon>
      <ion-label>Categorías</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
