<ion-segment (ionChange)="onFilter($event)">
  <ion-segment-button value="">
    <ion-label>Todas</ion-label>
  </ion-segment-button>

  <ion-segment-button *ngFor="let c of categories$ | async" [value]="c.id">
    <ion-label>{{ c.name }}</ion-label>
  </ion-segment-button>
</ion-segment>

<cdk-virtual-scroll-viewport itemSize="72" style="height: 100vh">
  <ion-item *cdkVirtualFor="let task of tasks$ | async">
    <ion-checkbox
      slot="start"
      [checked]="task.completed"
      (ionChange)="toggle(task.id)">
    </ion-checkbox>
    <ion-label>{{ task.title }}</ion-label>
    <ion-label>{{ task.description }}</ion-label>
  </ion-item>
</cdk-virtual-scroll-viewport>
