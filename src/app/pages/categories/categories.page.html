<ion-header>
  <ion-toolbar>
    <ion-title>Categorías</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input
      placeholder="Nueva Categoría"
      [(ngModel)]="newCategory">
    </ion-input>
    <ion-button slot="end" (click)="add()">
      <ion-icon name="create-outline"></ion-icon>
    </ion-button>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let c of categories$ | async">
      <ion-label>{{c.name}}</ion-label>
      <ion-label>{{c.description}}</ion-label>
      <ion-button
        slot="end"
        color="danger"
        fill="clear"
        (click)="delete(c.id)"
      >
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
